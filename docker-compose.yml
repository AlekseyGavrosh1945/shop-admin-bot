services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри контейнера до БД на хосте идём через host.docker.internal
      DATABASE_URL: ${DATABASE_URL_DOCKER:-root:devroot@tcp(host.docker.internal:3307)/toflow?parseTime=true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8081}:8081"
